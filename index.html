<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Calendrier scolaire</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --accent: #84000d;
    --row-height: 130px;
    --gris-weekend: #e9e9e9;
    --gris-vacances: #dcdcdc;
    --jour-actuel: #fff3b0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 12px;
    color: #222;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  #logo-wrap {
    position: relative;
    cursor: pointer;
  }
  #logo-img {
    height: 56px;
    max-width: 160px;
    object-fit: contain;
    border: 1px dashed transparent;
  }
  #logo-wrap:hover #logo-img {
    border-color: #aaa;
  }
  #logo-input { display: none; }
  #titre-annee {
    font-size: 20px;
    font-weight: bold;
    color: var(--accent);
    margin: 0;
    flex-grow: 1;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button:hover { opacity: 0.85; }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  #nav button {
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 16px;
  }
  #nav button:disabled { opacity: 0.35; cursor: not-allowed; }
  #mois-label {
    font-size: 18px;
    font-weight: 600;
    text-transform: capitalize;
    min-width: 220px;
    text-align: center;
  }
  table.calendar {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.calendar th {
    background: var(--accent);
    color: #fff;
    padding: 6px;
    font-size: 13px;
  }
  table.calendar td {
    border: 1px solid #ccc;
    vertical-align: top;
    height: var(--row-height);
    padding: 4px;
    font-size: 12px;
    overflow: hidden;
  }
  td.autre-mois { background: #f7f7f7; color: #bbb; }
  td.weekend { background: var(--gris-weekend); }
  td.vacances { background: var(--gris-vacances); }
  td.aujourdhui { background: var(--jour-actuel); }
  .num-jour {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 3px;
  }
  .evt {
    background: #fff;
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    padding: 2px 4px;
    margin-bottom: 2px;
    font-size: 11px;
    line-height: 1.3;
    word-wrap: break-word;
  }
  .evt.jour-entier { border-left-color: #555; }

  @media print {
    @page { size: A3 landscape; margin: 8mm; }
    .toolbar, #logo-wrap input, #nav button { display: none !important; }
    body { padding: 0; }
    table.calendar td { height: 150px; }
  }
</style>
</head>
<body>

<header>
  <div id="logo-wrap" title="Cliquer pour changer le logo">
    <img id="logo-img" src="" alt="Logo" style="display:none;">
    <input type="file" id="logo-input" accept="image/*">
  </div>
  <h1 id="titre-annee">Calendrier pédagogique — Année scolaire 2026-2027</h1>
  <div class="toolbar">
    <button id="btn-print">🖨️ Imprimer</button>
    <button id="btn-ical">📅 Exporter iCal</button>
  </div>
</header>

<div id="nav">
  <button id="btn-prev">◀</button>
  <div id="mois-label"></div>
  <button id="btn-next">▶</button>
</div>

<table class="calendar">
  <thead>
    <tr>
      <th>Lundi</th><th>Mardi</th><th>Mercredi</th><th>Jeudi</th>
      <th>Vendredi</th><th>Samedi</th><th>Dimanche</th>
    </tr>
  </thead>
  <tbody id="grid"></tbody>
</table>

<script>
// ---------- Bornes de l'année scolaire ----------
const ANNEE_DEBUT = { annee: 2026, mois: 8 };  // septembre 2026 (mois 0-indexé : 8 = sept)
const ANNEE_FIN    = { annee: 2027, mois: 6 };  // juillet 2027   (6 = juillet)

let current = clampToSchoolYear(new Date());
let records = [];

function clampToSchoolYear(d) {
  let a = d.getFullYear(), m = d.getMonth();
  const avantDebut = (a < ANNEE_DEBUT.annee) || (a === ANNEE_DEBUT.annee && m < ANNEE_DEBUT.mois);
  const apresFin   = (a > ANNEE_FIN.annee) || (a === ANNEE_FIN.annee && m > ANNEE_FIN.mois);
  if (avantDebut) return { annee: ANNEE_DEBUT.annee, mois: ANNEE_DEBUT.mois };
  if (apresFin)   return { annee: ANNEE_FIN.annee, mois: ANNEE_FIN.mois };
  return { annee: a, mois: m };
}

function estEnDehors(annee, mois, borne) {
  return (annee === borne.annee && mois === borne.mois);
}

// ---------- Connexion à Grist ----------
grist.ready({
  columns: [
    { name: "Titre", title: "Titre de l'action" },
    { name: "Description", title: "Description", optional: true },
    { name: "DateDebut", title: "Date (début, avec heure)", type: "DateTime" },
    { name: "DateFin", title: "Date de fin (avec heure)", type: "DateTime" },
    { name: "ToutelaJournee", title: "Toute la journée", optional: true },
    { name: "Categorie", title: "Catégorie d'action", optional: true }
  ],
  requiredAccess: "read table"
});

grist.onRecords(function (data, mappings) {
  const mapped = data.map(r => grist.mapColumnNames(r, { mappings }) || r);
  records = mapped.filter(r => r.DateDebut).map(r => ({
    titre: r.Titre || "(sans titre)",
    description: r.Description || "",
    debut: toDate(r.DateDebut),
    fin: toDate(r.DateFin || r.DateDebut),
    jourEntier: !!r.ToutelaJournee,
    categorie: r.Categorie || ""
  }));
  render();
});

function toDate(v) {
  // Les colonnes Date/DateTime de Grist arrivent en secondes depuis epoch (UTC)
  if (typeof v === "number") return new Date(v * 1000);
  if (v instanceof Date) return v;
  return new Date(v);
}

function jourSeul(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

// ---------- Logo personnalisé (stocké dans le document, partagé) ----------
const logoImg = document.getElementById("logo-img");
const logoInput = document.getElementById("logo-input");

grist.onOptions(function (options) {
  if (options && options.logo) {
    logoImg.src = options.logo;
    logoImg.style.display = "block";
  }
});

document.getElementById("logo-wrap").addEventListener("click", () => logoInput.click());
logoInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    logoImg.src = reader.result;
    logoImg.style.display = "block";
    await grist.setOption("logo", reader.result);
  };
  reader.readAsDataURL(file);
});

// ---------- Navigation ----------
document.getElementById("btn-prev").addEventListener("click", () => {
  let { annee, mois } = current;
  mois--; if (mois < 0) { mois = 11; annee--; }
  current = { annee, mois };
  render();
});
document.getElementById("btn-next").addEventListener("click", () => {
  let { annee, mois } = current;
  mois++; if (mois > 11) { mois = 0; annee++; }
  current = { annee, mois };
  render();
});

const MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet",
                 "août","septembre","octobre","novembre","décembre"];

// ---------- Rendu du calendrier ----------
function render() {
  const { annee, mois } = current;
  document.getElementById("mois-label").textContent = `${MOIS_FR[mois]} ${annee}`;
  document.getElementById("btn-prev").disabled = estEnDehors(annee, mois, ANNEE_DEBUT);
  document.getElementById("btn-next").disabled = estEnDehors(annee, mois, ANNEE_FIN);

  const premierDuMois = new Date(annee, mois, 1);
  // Décalage pour démarrer la grille un lundi (0 = lundi ... 6 = dimanche)
  let decalage = (premierDuMois.getDay() + 6) % 7;
  const debutGrille = new Date(annee, mois, 1 - decalage);

  const aujourdhui = jourSeul(new Date());
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let semaine = 0; semaine < 6; semaine++) {
    const tr = document.createElement("tr");
    for (let jsem = 0; jsem < 7; jsem++) {
      const d = new Date(debutGrille);
      d.setDate(debutGrille.getDate() + semaine * 7 + jsem);
      const td = document.createElement("td");

      if (d.getMonth() !== mois) td.classList.add("autre-mois");
      if (jsem >= 5) td.classList.add("weekend");
      if (d.getTime() === aujourdhui.getTime()) td.classList.add("aujourdhui");

      const evtsJour = records.filter(r => {
        const db = jourSeul(r.debut), df = jourSeul(r.fin);
        return d >= db && d <= df;
      });

      if (evtsJour.some(e => /vacances|f[ée]ri[ée]/i.test(e.titre))) {
        td.classList.add("vacances");
      }

      const num = document.createElement("div");
      num.className = "num-jour";
      num.textContent = d.getDate();
      td.appendChild(num);

      evtsJour.forEach(e => {
        const db = jourSeul(e.debut), df = jourSeul(e.fin);
        let label = e.titre;
        if (db.getTime() !== df.getTime()) {
          if (d.getTime() === db.getTime()) label += " (début)";
          else if (d.getTime() === df.getTime()) label += " (fin)";
          else return; // on n'affiche que début/fin pour les événements multi-jours
        }
        const div = document.createElement("div");
        div.className = "evt" + (e.jourEntier ? " jour-entier" : "");
        div.textContent = label;
        div.title = e.description || "";
        td.appendChild(div);
      });

      tr.appendChild(td);
    }
    grid.appendChild(tr);
  }
}

// ---------- Impression ----------
document.getElementById("btn-print").addEventListener("click", () => window.print());

// ---------- Export iCal ----------
document.getElementById("btn-ical").addEventListener("click", () => {
  const lignes = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Calendrier pedagogique//FR",
    "CALSCALE:GREGORIAN"
  ];
  records.forEach((r, i) => {
    const fmt = (d, jourEntier) => {
      const pad = n => String(n).padStart(2, "0");
      if (jourEntier) {
        return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
      }
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    };
    lignes.push("BEGIN:VEVENT");
    lignes.push(`UID:${Date.now()}-${i}@calendrier-pedagogique`);
    if (r.jourEntier) {
      const finPlusUn = new Date(r.fin);
      finPlusUn.setDate(finPlusUn.getDate() + 1); // DTEND exclusif pour les événements jour entier
      lignes.push(`DTSTART;VALUE=DATE:${fmt(r.debut, true)}`);
      lignes.push(`DTEND;VALUE=DATE:${fmt(finPlusUn, true)}`);
    } else {
      lignes.push(`DTSTART:${fmt(r.debut, false)}`);
      lignes.push(`DTEND:${fmt(r.fin, false)}`);
    }
    lignes.push(`SUMMARY:${escapeICS(r.titre)}`);
    if (r.description) lignes.push(`DESCRIPTION:${escapeICS(r.description)}`);
    if (r.categorie) lignes.push(`CATEGORIES:${escapeICS(r.categorie)}`);
    lignes.push("END:VEVENT");
  });
  lignes.push("END:VCALENDAR");

  const blob = new Blob([lignes.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "calendrier-pedagogique-2026-2027.ics";
  a.click();
  URL.revokeObjectURL(url);
});

function escapeICS(txt) {
  return String(txt).replace(/([,;])/g, "\\$1").replace(/\n/g, "\\n");
}

render();
</script>
</body>
</html>
