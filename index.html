<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Calendrier scolaire</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <meta name="color-scheme" content="light only">
  <style>
    html, body { background: #ffffff !important; }
    :root {
      --accent: #84000d;
      --row-height: 130px;
      --row-height-annee: 34px;
      --gris-weekend: #e9e9e9;
      --gris-vacances: #dcdcdc;
      --jour-actuel: #fff3b0;
    }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; padding: 12px; color: #222; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
    #logo-wrap {
      position: relative;
      min-width: 90px; min-height: 56px;
      display: flex; align-items: center; justify-content: center;
    }
    #logo-placeholder {
      border: 2px dashed #ddd; border-radius: 6px; color: #aaa;
      font-size: 12px; padding: 10px 14px; text-align: center;
      line-height: 1.3; white-space: nowrap;
    }
    #logo-img { height: 56px; max-width: 160px; object-fit: contain; border: 1px dashed transparent; }
    #titre-annee { font-size: 20px; font-weight: bold; color: var(--accent); margin: 0; flex-grow: 1; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar button {
      background: var(--accent); color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.85; }
    .toolbar label.mini { font-size: 13px; display: flex; align-items: center; gap: 5px; }
    #color-picker { width: 36px; height: 30px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; padding: 2px; }
    #zone-select { padding: 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }

    #source-status { font-size: 12px; color: #777; margin: -4px 0 10px 0; }

    #view-switch { display: flex; gap: 6px; margin-bottom: 10px; }
    #view-switch button {
      background: #eee; border: 1px solid #ccc; border-radius: 6px;
      padding: 7px 14px; cursor: pointer; font-size: 14px;
    }
    #view-switch button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    #nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    #nav button { background: #eee; border: 1px solid #ccc; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 16px; }
    #nav button:disabled { opacity: 0.35; cursor: not-allowed; }
    #mois-label { font-size: 18px; font-weight: 600; text-transform: capitalize; min-width: 220px; text-align: center; }

    table.calendar { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.calendar th { background: var(--accent); color: #fff; padding: 6px; font-size: 13px; }
    table.calendar td {
      background: #fff;
      border: 1px solid #ccc; vertical-align: top; height: var(--row-height);
      padding: 4px; font-size: 12px; overflow: hidden;
    }
    td.autre-mois { background: #f7f7f7; color: #bbb; }
    td.weekend { background: var(--gris-weekend); }
    td.vacances { background: var(--gris-vacances); }
    td.aujourdhui { background: var(--jour-actuel); }
    .num-jour { font-weight: bold; font-size: 13px; margin-bottom: 3px; }
    .evt {
      background: #fff; border-left: 3px solid var(--accent); border-radius: 3px;
      padding: 2px 4px; margin-bottom: 2px; font-size: 11px; line-height: 1.3; word-wrap: break-word;
    }
    .evt.jour-entier { border-left-color: #555; }
    .evt.officiel { border-left-color: #888; font-style: italic; color: #555; }

    table.annuelle { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.annuelle th { background: var(--accent); color: #fff; padding: 5px; font-size: 12px; position: sticky; top: 0; }
    table.annuelle td { background: #fff; border: 1px solid #ccc; font-size: 10px; padding: 2px 3px; vertical-align: top; height: var(--row-height-annee); overflow: hidden; }
    table.annuelle td.col-jour { font-weight: bold; text-align: center; vertical-align: middle; background: #f2f2f2; position: sticky; left: 0; }
    table.annuelle td.weekend { background: var(--gris-weekend); }
    table.annuelle td.vacances { background: var(--gris-vacances); }
    table.annuelle td.aujourdhui { background: var(--jour-actuel); }
    table.annuelle td.na { background: #fafafa; }
    #annee-scroll { overflow-x: auto; }

    .cache { display: none !important; }

    table.calendar.sans-weekend th:nth-child(6),
    table.calendar.sans-weekend th:nth-child(7),
    table.calendar.sans-weekend td:nth-child(6),
    table.calendar.sans-weekend td:nth-child(7) {
      display: none;
    }

    @media print {
      @page { size: A3 landscape; margin: 8mm; }
      .toolbar, #view-switch, #nav button, #source-status { display: none !important; }
      body { padding: 0; }
      table.calendar td { height: 150px; }
      table.annuelle td { height: 40px; }
    }
  </style>
</head>
<body>

<header>
  <div id="logo-wrap" title="Le logo se gère dans la table Parametres_Calendrier (colonne Logo)">
    <img id="logo-img" src="" alt="Logo" style="display:none;">
    <div id="logo-placeholder">🖼️<br>Pas de logo<br>configuré</div>
  </div>
  <h1 id="titre-annee">Calendrier pédagogique — Année scolaire 2026-2027</h1>
  <div class="toolbar">
    <label class="mini">Couleur
      <input type="color" id="color-picker" value="#84000d" title="Couleur du calendrier">
    </label>
    <label class="mini">Zone académique
      <select id="zone-select">
        <option value="Zone A">Zone A (Dijon...)</option>
        <option value="Zone B">Zone B</option>
        <option value="Zone C">Zone C</option>
      </select>
    </label>
    <button id="btn-toggle-weekend">🚫 Masquer les week-ends</button>
    <button id="btn-print">🖨️ Imprimer</button>
    <button id="btn-ical">📅 Exporter iCal</button>
  </div>
</header>
<div id="source-status">Chargement des vacances et jours fériés officiels…</div>

<div id="view-switch">
  <button id="btn-view-mois" class="active">Vue mensuelle</button>
  <button id="btn-view-annee">Vue annuelle</button>
</div>

<div id="vue-mois">
  <div id="nav">
    <button id="btn-prev">◀</button>
    <div id="mois-label"></div>
    <button id="btn-next">▶</button>
  </div>
  <table class="calendar">
    <thead>
      <tr><th>Lundi</th><th>Mardi</th><th>Mercredi</th><th>Jeudi</th><th>Vendredi</th><th>Samedi</th><th>Dimanche</th></tr>
    </thead>
    <tbody id="grid"></tbody>
  </table>
</div>

<div id="vue-annee" class="cache">
  <div id="annee-scroll">
    <table class="annuelle">
      <thead><tr id="annee-entete"></tr></thead>
      <tbody id="annee-corps"></tbody>
    </table>
  </div>
</div>

<script>
// ---------- Bornes de l'année scolaire ----------
const ANNEE_DEBUT = { annee: 2026, mois: 8 };  // septembre 2026
const ANNEE_FIN = { annee: 2027, mois: 6 };   // juillet 2027
const ANNEE_SCOLAIRE_LABEL = "2026-2027";

const MOIS_ANNEE = [
  { annee: 2026, mois: 8,  label: "Sept. 2026" },
  { annee: 2026, mois: 9,  label: "Oct. 2026" },
  { annee: 2026, mois: 10, label: "Nov. 2026" },
  { annee: 2026, mois: 11, label: "Déc. 2026" },
  { annee: 2027, mois: 0,  label: "Jan. 2027" },
  { annee: 2027, mois: 1,  label: "Fév. 2027" },
  { annee: 2027, mois: 2,  label: "Mars 2027" },
  { annee: 2027, mois: 3,  label: "Avril 2027" },
  { annee: 2027, mois: 4,  label: "Mai 2027" },
  { annee: 2027, mois: 5,  label: "Juin 2027" },
  { annee: 2027, mois: 6,  label: "Juillet 2027" }
];

let current = clampToSchoolYear(new Date());
let masquerWeekend = false;
let gristRecords = [];
let recordsOfficiels = [];
let records = [];

// ---------- Fonctions utilitaires ----------
function clampToSchoolYear(d) {
  let a = d.getFullYear(), m = d.getMonth();
  const avantDebut = (a < ANNEE_DEBUT.annee) || (a === ANNEE_DEBUT.annee && m < ANNEE_DEBUT.mois);
  const apresFin = (a > ANNEE_FIN.annee) || (a === ANNEE_FIN.annee && m > ANNEE_FIN.mois);
  if (avantDebut) return { annee: ANNEE_DEBUT.annee, mois: ANNEE_DEBUT.mois };
  if (apresFin) return { annee: ANNEE_FIN.annee, mois: ANNEE_FIN.mois };
  return { annee: a, mois: m };
}

function estEnDehors(annee, mois, borne) {
  return (annee === borne.annee && mois === borne.mois);
}

function jourSeul(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function toDate(v) {
  if (typeof v === "number") return new Date(v * 1000);
  if (v instanceof Date) return v;
  return new Date(v);
}

function fusionnerRecords() {
  records = gristRecords.concat(recordsOfficiels);
  renderVueActive();
}

// ---------- Connexion à Grist ----------
grist.ready({
  columns: [
    { name: "Titre", title: "Titre de l'action" },
    { name: "Description", title: "Description", optional: true },
    { name: "DateDebut", title: "Date (début, avec heure)", type: "DateTime" },
    { name: "DateFin", title: "Date de fin (avec heure)", type: "DateTime" },
    { name: "ToutelaJournee", title: "Toute la journée", optional: true },
    { name: "Categorie", title: "Catégorie d'action", optional: true }
  ],
  requiredAccess: "full"
});

grist.onRecords(function (data, mappings) {
  const mapped = data.map(r => grist.mapColumnNames(r, { mappings }) || r);
  gristRecords = mapped
    .filter(r => r.DateDebut)
    .map(r => ({
      titre: r.Titre || "(sans titre)",
      description: r.Description || "",
      debut: toDate(r.DateDebut),
      fin: toDate(r.DateFin || r.DateDebut),
      jourEntier: !!r.ToutelaJournee,
      categorie: r.Categorie || "",
      officiel: false
    }));
  fusionnerRecords();
});

// ---------- Options partagées du document (couleur + zone) ----------
const logoImg = document.getElementById("logo-img");
const colorPicker = document.getElementById("color-picker");
const zoneSelect = document.getElementById("zone-select");

grist.onOptions(function (options) {
  if (options && options.accentColor) {
    document.documentElement.style.setProperty("--accent", options.accentColor);
    colorPicker.value = options.accentColor;
  }
  if (options && options.zone) {
    zoneSelect.value = options.zone;
  }
  if (options && typeof options.masquerWeekend === "boolean") {
    masquerWeekend = options.masquerWeekend;
    document.getElementById("btn-toggle-weekend").textContent =
      masquerWeekend ? "✅ Afficher les week-ends" : "🚫 Masquer les week-ends";
    document.querySelector("table.calendar").classList.toggle("sans-weekend", masquerWeekend);
  }
  chargerDonneesOfficielles();
});

// ---------- Logo : lu depuis la pièce jointe native Grist ----------
const TABLE_PARAMETRES = "Parametres_Calendrier";
const COLONNE_LOGO = "Logo";

async function chargerLogoNatif() {
  try {
    // Récupérer les données de la table
    const data = await grist.docApi.fetchSelectedTable();
    if (!data || !data.length) {
      console.warn("Aucune ligne sélectionnée dans la table Parametres_Calendrier.");
      return;
    }

    // Vérifier si la colonne Logo existe et contient une pièce jointe
    const row = data[0]; // On prend la première ligne
    if (!row || !row[COLONNE_LOGO] || !row[COLONNE_LOGO].length) {
      console.warn("Aucun logo trouvé dans la colonne " + COLONNE_LOGO);
      return;
    }

    // Récupérer l'ID de la pièce jointe (Grist stocke les attachments sous forme de liste)
    const attachmentId = row[COLONNE_LOGO][0]; // Premier attachment
    if (!attachmentId) {
      console.warn("ID de pièce jointe invalide.");
      return;
    }

    // Récupérer le token d'accès
    const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
    if (!tokenInfo || !tokenInfo.token) {
      console.warn("Impossible de récupérer le token d'accès.");
      return;
    }

    // Construire l'URL de l'image
    const logoUrl = `${tokenInfo.baseUrl}/attachments/${attachmentId}/download?auth=${tokenInfo.token}`;

    // Mettre à jour l'affichage
    logoImg.src = logoUrl;
    logoImg.style.display = "block";
    document.getElementById("logo-placeholder").style.display = "none";

    console.log("Logo chargé avec succès :", logoUrl);
  } catch (err) {
    console.error("Erreur lors du chargement du logo :", err);
  }
}
// ---------- Chargement des vacances scolaires + jours fériés officiels ----------
async function chargerDonneesOfficielles() {
  const statusEl = document.getElementById("source-status");
  statusEl.textContent = "Chargement des vacances et jours fériés officiels…";
  const zone = zoneSelect.value || "Zone A";
  const resultats = [];

  // --- Vacances scolaires (data.education.gouv.fr) ---
  try {
    const params = new URLSearchParams();
    params.set("limit", "100");
    params.append("refine", `zones:"${zone}"`);
    params.append("refine", `population:"-"`);
    params.append("refine", `annee_scolaire:"${ANNEE_SCOLAIRE_LABEL}"`);
    const url = "https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?" + params.toString();
    const res = await fetch(url);
    if (res.ok) {
      const json = await res.json();
      const lignes = json.results || [];
      const dejaVus = new Set();
      lignes.forEach(r => {
        if (!r.start_date || !r.end_date) return;
        const cle = `${r.start_date}|${r.end_date}|${r.description}`;
        if (dejaVus.has(cle)) return;
        dejaVus.add(cle);
        resultats.push({
          titre: r.description || "Vacances scolaires",
          description: "Source : Ministère de l'Éducation nationale",
          debut: new Date(r.start_date),
          fin: new Date(r.end_date),
          jourEntier: true,
          categorie: "Vacances scolaires",
          officiel: true
        });
      });
    }
  } catch (err) {
    console.error("Erreur chargement vacances scolaires :", err);
  }

  // --- Jours fériés (calendrier.api.gouv.fr) ---
  try {
    const annees = [ANNEE_DEBUT.annee, ANNEE_FIN.annee];
    for (const annee of annees) {
      const res = await fetch(`https://calendrier.api.gouv.fr/jours-feries/metropole/${annee}.json`);
      if (res.ok) {
        const json = await res.json();
        Object.entries(json).forEach(([date, nom]) => {
          resultats.push({
            titre: `Férié : ${nom}`,
            description: "",
            debut: new Date(date + "T00:00:00"),
            fin: new Date(date + "T00:00:00"),
            jourEntier: true,
            categorie: "Jour férié",
            officiel: true
          });
        });
      }
    }
  } catch (err) {
    console.error("Erreur chargement jours fériés :", err);
  }

  recordsOfficiels = resultats;
  statusEl.textContent = resultats.length
    ? `${resultats.length} vacances/jours fériés officiels chargés (${zone}).`
    : "Impossible de charger les vacances/jours fériés officiels pour le moment (vérifiez la connexion).";
  fusionnerRecords();
}

// ---------- Bascule Vue mensuelle / Vue annuelle ----------
const btnViewMois = document.getElementById("btn-view-mois");
const btnViewAnnee = document.getElementById("btn-view-annee");
const vueMois = document.getElementById("vue-mois");
const vueAnnee = document.getElementById("vue-annee");
let vueActuelle = "mois";

btnViewMois.addEventListener("click", () => {
  vueActuelle = "mois";
  btnViewMois.classList.add("active");
  btnViewAnnee.classList.remove("active");
  vueMois.classList.remove("cache");
  vueAnnee.classList.add("cache");
  renderVueActive();
});

btnViewAnnee.addEventListener("click", () => {
  vueActuelle = "annee";
  btnViewAnnee.classList.add("active");
  btnViewMois.classList.remove("active");
  vueAnnee.classList.remove("cache");
  vueMois.classList.add("cache");
  renderVueActive();
});

function renderVueActive() {
  if (vueActuelle === "mois") renderMois();
  else renderAnnee();
}

// ---------- Recherche des événements d'un jour donné ----------
function evenementsDuJour(d) {
  const res = [];
  records.forEach(e => {
    const db = jourSeul(e.debut), df = jourSeul(e.fin);
    if (d < db || d > df) return;
    let label = e.titre;
    if (db.getTime() !== df.getTime()) {
      if (d.getTime() === db.getTime()) label += " (début)";
      else if (d.getTime() === df.getTime()) label += " (fin)";
      else return;
    }
    res.push({ label, jourEntier: e.jourEntier, officiel: e.officiel, titreBrut: e.titre });
  });
  return res;
}

function estJourVacancesOuFerie(d) {
  return records.some(e => {
    if (!/vacances|f[ée]ri[ée]/i.test(e.titre)) return false;
    const db = jourSeul(e.debut), df = jourSeul(e.fin);
    return d >= db && d <= df;
  });
}

// ---------- Navigation (vue mensuelle) ----------
document.getElementById("btn-prev").addEventListener("click", () => {
  let { annee, mois } = current;
  mois--;
  if (mois < 0) { mois = 11; annee--; }
  current = { annee, mois };
  renderMois();
});

document.getElementById("btn-next").addEventListener("click", () => {
  let { annee, mois } = current;
  mois++;
  if (mois > 11) { mois = 0; annee++; }
  current = { annee, mois };
  renderMois();
});

const MOIS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

function renderMois() {
  const { annee, mois } = current;
  document.getElementById("mois-label").textContent = `${MOIS_FR[mois]} ${annee}`;
  document.getElementById("btn-prev").disabled = estEnDehors(annee, mois, ANNEE_DEBUT);
  document.getElementById("btn-next").disabled = estEnDehors(annee, mois, ANNEE_FIN);

  const premierDuMois = new Date(annee, mois, 1);
  let decalage = (premierDuMois.getDay() + 6) % 7;
  const debutGrille = new Date(annee, mois, 1 - decalage);
  const aujourdhui = jourSeul(new Date());

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let semaine = 0; semaine < 6; semaine++) {
    const tr = document.createElement("tr");
    for (let jsem = 0; jsem < 7; jsem++) {
      const d = new Date(debutGrille);
      d.setDate(debutGrille.getDate() + semaine * 7 + jsem);
      const td = document.createElement("td");

      if (d.getMonth() !== mois) td.classList.add("autre-mois");
      if (jsem >= 5) td.classList.add("weekend");
      if (d.getTime() === aujourdhui.getTime()) td.classList.add("aujourdhui");

      const evts = evenementsDuJour(d);
      if (estJourVacancesOuFerie(d)) td.classList.add("vacances");

      const num = document.createElement("div");
      num.className = "num-jour";
      num.textContent = d.getDate();
      td.appendChild(num);

      evts.forEach(e => {
        const div = document.createElement("div");
        div.className = "evt" + (e.jourEntier ? " jour-entier" : "") + (e.officiel ? " officiel" : "");
        div.textContent = e.label;
        td.appendChild(div);
      });

      tr.appendChild(td);
    }
    grid.appendChild(tr);
  }
}

function renderAnnee() {
  const entete = document.getElementById("annee-entete");
  entete.innerHTML = "<th>Jour</th>" + MOIS_ANNEE.map(m => `<th>${m.label}</th>`).join("");

  const corps = document.getElementById("annee-corps");
  corps.innerHTML = "";
  const aujourdhui = jourSeul(new Date());

  for (let jour = 1; jour <= 31; jour++) {
    const tr = document.createElement("tr");
    const tdJour = document.createElement("td");
    tdJour.className = "col-jour";
    tdJour.textContent = jour;
    tr.appendChild(tdJour);

    MOIS_ANNEE.forEach(m => {
      const nbJours = new Date(m.annee, m.mois + 1, 0).getDate();
      const td = document.createElement("td");
      if (jour > nbJours) { td.classList.add("na"); tr.appendChild(td); return; }
      const d = new Date(m.annee, m.mois, jour);
      if (d.getDay() === 0 || d.getDay() === 6) td.classList.add("weekend");
      if (d.getTime() === aujourdhui.getTime()) td.classList.add("aujourdhui");

      const evts = evenementsDuJour(d);
      if (estJourVacancesOuFerie(d)) td.classList.add("vacances");
      td.textContent = evts.map(e => e.label).join(" / ");
      td.title = td.textContent;

      tr.appendChild(td);
    });
    corps.appendChild(tr);
  }
}

// ---------- Impression ----------
document.getElementById("btn-print").addEventListener("click", () => window.print());

// ---------- Export iCal (corrigé avec DTSTAMP et gestion des dates) ----------
function escapeICS(txt) {
  return String(txt)
    .replace(/([,;:\\])/g, "\\$1")  // Échappe les caractères spéciaux
    .replace(/\n/g, "\\n");
}

function formatDateForICS(date, allDay) {
  const pad = (n) => String(n).padStart(2, "0");
  const year = date.getFullYear();
  const month = pad(date.getMonth() + 1);
  const day = pad(date.getDate());

  if (allDay) {
    return `${year}${month}${day}`;  // Format DATE (AAAAAAMMJJ)
  } else {
    const hours = pad(date.getHours());
    const minutes = pad(date.getMinutes());
    return `${year}${month}${day}T${hours}${minutes}00`;  // Format DATE-TIME (AAAAAAMMJJTHHMMSS)
  }
}

document.getElementById("btn-ical").addEventListener("click", async () => {
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Calendrier pedagogique//FR",
    "CALSCALE:GREGORIAN",
    `DTSTAMP:${formatDateForICS(new Date(), false)}Z`,  // DTSTAMP au niveau du calendrier
  ];

  // Filtrer les événements valides (avec debut et fin)
  const validRecords = records.filter(r => r.debut && r.fin && r.debut <= r.fin);

  for (const [index, r] of validRecords.entries()) {
    lines.push("BEGIN:VEVENT");
    lines.push(`DTSTAMP:${formatDateForICS(new Date(), false)}Z`);  // DTSTAMP pour chaque événement
    lines.push(`UID:${Date.now()}-${index}@calendrier-pedagogique`);

    if (r.jourEntier) {
      // Pour les événements toute la journée, DTEND = DTSTART + 1 jour
      const startDate = formatDateForICS(r.debut, true);
      const endDate = new Date(r.fin);
      endDate.setDate(endDate.getDate() + 1);  // Ajouter 1 jour pour DTEND
      lines.push(`DTSTART;VALUE=DATE:${startDate}`);
      lines.push(`DTEND;VALUE=DATE:${formatDateForICS(endDate, true)}`);
    } else {
      // Pour les événements avec heure, utiliser le format DATE-TIME
      lines.push(`DTSTART:${formatDateForICS(r.debut, false)}`);
      lines.push(`DTEND:${formatDateForICS(r.fin, false)}`);
    }

    lines.push(`SUMMARY:${escapeICS(r.titre)}`);
    if (r.description) lines.push(`DESCRIPTION:${escapeICS(r.description)}`);
    if (r.categorie) lines.push(`CATEGORIES:${escapeICS(r.categorie)}`);
    lines.push("END:VEVENT");
  }

  lines.push("END:VCALENDAR");

  // Générer le fichier
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "calendrier-pedagogique-2026-2027.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
  // Ajout de DTSTAMP pour chaque événement (obligatoire selon RFC 5545)
  const now = new Date();
  const dtStamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}T${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}00Z`;

  records.forEach((r, i) => {
    lignes.push("BEGIN:VEVENT");
    lignes.push(`DTSTAMP:${dtStamp}`);
    lignes.push(`UID:${Date.now()}-${i}@calendrier-pedagogique`);

    if (r.jourEntier) {
      const finPlusUn = new Date(r.fin);
      finPlusUn.setDate(finPlusUn.getDate() + 1);
      lignes.push(`DTSTART;VALUE=DATE:${formatDateICS(r.debut, true)}`);
      lignes.push(`DTEND;VALUE=DATE:${formatDateICS(finPlusUn, true)}`);
    } else {
      lignes.push(`DTSTART:${formatDateICS(r.debut, false)}`);
      lignes.push(`DTEND:${formatDateICS(r.fin, false)}`);
    }

    lignes.push(`SUMMARY:${escapeICS(r.titre)}`);
    if (r.description) lignes.push(`DESCRIPTION:${escapeICS(r.description)}`);
    if (r.categorie) lignes.push(`CATEGORIES:${escapeICS(r.categorie)}`);
    lignes.push("END:VEVENT");
  });

  lignes.push("END:VCALENDAR");

  const blob = new Blob([lignes.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "calendrier-pedagogique-2026-2027.ics";
  a.click();
  URL.revokeObjectURL(url);
});

// ---------- Initialisation ----------
renderMois();
chargerDonneesOfficielles();
</script>
